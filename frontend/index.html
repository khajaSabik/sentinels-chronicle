<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sentinel's Chronicle</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>🗡️ THE SENTINEL'S CHRONICLE</h1>
                <p class="subtitle">Security events remembered as stories</p>
            </div>
        </header>

        <main>
            <section class="chronicle-grid">
                <div id="chronicles-container">
                    <div class="loading">Loading chronicles...</div>
                </div>
            </section>

            <section class="stats">
                <div class="stat-card">
                    <h3>Total Chronicles</h3>
                    <p id="total-count">0</p>
                </div>
                <div class="stat-card">
                    <h3>Latest Severity</h3>
                    <p id="latest-severity">-</p>
                </div>
                <div class="stat-card">
                    <h3>Style Memory</h3>
                    <p id="style-memory">Loading...</p>
                </div>
            </section>
        </main>

        <footer>
            <p>⚔️ The Sentinel watches. The Chronicle endures.</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
